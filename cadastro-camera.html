<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Produto - SEV7N CELL</title>

  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@latest/dist/iife/reader/index.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f8;
      color: #172033;
    }

    header {
      background: #071b3a;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .82;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px 40px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .titulo {
      margin: 0 0 15px;
      font-size: 19px;
      color: #071b3a;
    }

    .leitor {
      display: none;
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 270px;
    }

    .leitor.ativo {
      display: block;
    }

    #video {
      width: 100%;
      min-height: 270px;
      max-height: 430px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .mira {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 34%;
      height: 32%;
      border: 3px solid #22c55e;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.16);
      pointer-events: none;
    }

    .linha {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 50%;
      height: 3px;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      pointer-events: none;
    }

    .dica {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 8px;
      text-align: center;
      color: white;
      background: rgba(0,0,0,.65);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
    }

    .acoes {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-abrir {
      flex: 1;
      background: #1d5da8;
      color: white;
    }

    .btn-parar {
      background: #e5e7eb;
      color: #333;
    }

    .btn-salvar {
      width: 100%;
      background: #15803d;
      color: white;
      font-size: 17px;
      margin-top: 5px;
    }

    .btn-proximo {
      width: 100%;
      background: #e5e7eb;
      color: #333;
      margin-top: 10px;
    }

    .mensagem {
      margin-top: 12px;
      min-height: 22px;
      font-weight: bold;
      word-break: break-word;
    }

    .sucesso {
      color: #15803d;
    }

    .erro {
      color: #b91c1c;
    }

    .aviso {
      color: #9a6700;
    }

    .status-camera {
      margin-top: 8px;
      font-size: 13px;
      color: #475569;
      line-height: 1.4;
    }

    .codigo-lido {
      background: #dcfce7;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 9px;
      margin-top: 14px;
      display: none;
    }

    .codigo-lido strong {
      font-size: 20px;
    }

    .campo {
      margin-bottom: 16px;
    }

    .grade {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #1d5da8;
    }

    #codigoBarras {
      font-size: 21px;
      font-weight: bold;
      border: 2px solid #1d5da8;
    }

    #canvasLeitura {
      display: none;
    }

    .foto-preview {
      display: none;
      margin-top: 12px;
      text-align: center;
    }

    .foto-preview img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
    }

    @media (max-width: 600px) {

      .grade {
        grid-template-columns: 1fr;
      }

      .acoes {
        display: block;
      }

      .acoes button {
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SEV7N CELL</h1>
  <p>Cadastro rápido de produtos</p>
</header>

<div class="container">

  <div class="card">

    <h2 class="titulo">
      📷 Leitor ao vivo
    </h2>

    <div id="leitor" class="leitor">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <div class="mira"></div>
      <div class="linha"></div>

      <div class="dica">
        Mantenha o celular a cerca de 15–25 cm do código.
      </div>

    </div>

    <canvas id="canvasLeitura"></canvas>

    <div class="acoes">

      <button
        type="button"
        class="btn-abrir"
        onclick="iniciarLeitor()"
      >
        ABRIR LEITOR
      </button>

      <button
        type="button"
        class="btn-parar"
        onclick="pararLeitor()"
      >
        PARAR
      </button>

    </div>

    <div
      id="statusCamera"
      class="status-camera"
    ></div>

    <div
      id="codigoLido"
      class="codigo-lido"
    >
      Código identificado:
      <br>
      <strong id="codigoEncontrado"></strong>
    </div>

    <div
      id="mensagem"
      class="mensagem"
    ></div>

  </div>


  <div class="card">

    <h2 class="titulo">
      Dados do produto
    </h2>


    <div class="campo">

      <label for="codigoBarras">
        Código de barras *
      </label>

      <input
        id="codigoBarras"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Leia ou digite o código"
      >

    </div>


    <div class="campo">

      <label for="produto">
        Produto / descrição *
      </label>

      <input
        id="produto"
        type="text"
        autocomplete="off"
        placeholder="Ex.: Cabo Tipo C 1 metro"
      >

    </div>


    <div class="grade">

      <div class="campo">

        <label for="categoria">
          Categoria
        </label>

        <input
          id="categoria"
          type="text"
          placeholder="Ex.: CABO"
        >

      </div>


      <div class="campo">

        <label for="marca">
          Marca
        </label>

        <input
          id="marca"
          type="text"
          placeholder="Ex.: INOVA"
        >

      </div>


      <div class="campo">

        <label for="modelo">
          Modelo
        </label>

        <input
          id="modelo"
          type="text"
          placeholder="Modelo"
        >

      </div>


      <div class="campo">

        <label for="cor">
          Cor
        </label>

        <input
          id="cor"
          type="text"
          placeholder="Cor"
        >

      </div>


      <div class="campo">

        <label for="preco">
          Preço de venda *
        </label>

        <input
          id="preco"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.01"
          placeholder="0,00"
        >

      </div>


      <div class="campo">

        <label for="estoque">
          Estoque
        </label>

        <input
          id="estoque"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          value="1"
        >

      </div>

    </div>


    <div class="campo">

      <label for="foto">
        Foto do produto
      </label>

      <input
        id="foto"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="mostrarFoto(this)"
      >

      <div
        id="fotoPreview"
        class="foto-preview"
      >

        <img
          id="imagemPreview"
          alt="Foto do produto"
        >

      </div>

    </div>


    <button
      type="button"
      class="btn-salvar"
      onclick="validarProduto()"
    >
      SALVAR PRODUTO
    </button>


    <button
      type="button"
      class="btn-proximo"
      onclick="proximoProduto()"
    >
      LIMPAR / PRÓXIMO PRODUTO
    </button>

  </div>

</div>


<script>

const CHAVE_RASCUNHO =
  'sev7n_cadastro_produto_camera';

const CAMPOS = [
  'codigoBarras',
  'produto',
  'categoria',
  'marca',
  'modelo',
  'cor',
  'preco',
  'estoque'
];

let streamCamera = null;
let cameraAtiva = false;
let lendoQuadro = false;
let loopLeitura = null;
let ultimoCodigo = '';


// ==========================================
// MENSAGEM
// ==========================================

function mensagem(
  texto,
  tipo = ''
) {

  const elemento =
    document.getElementById(
      'mensagem'
    );

  elemento.className =
    'mensagem ' + tipo;

  elemento.textContent =
    texto || '';
}


function statusCamera(
  texto
) {

  document
    .getElementById(
      'statusCamera'
    )
    .textContent =
      texto || '';
}


// ==========================================
// SALVAR CAMPOS LOCALMENTE
// ==========================================

function salvarRascunho() {

  try {

    const dados = {};

    CAMPOS.forEach(
      id => {

        const campo =
          document.getElementById(id);

        if (campo) {

          dados[id] =
            campo.value || '';
        }
      }
    );

    localStorage.setItem(
      CHAVE_RASCUNHO,
      JSON.stringify(dados)
    );

  } catch (erro) {

    console.log(
      'Erro ao salvar rascunho:',
      erro
    );
  }
}


function restaurarRascunho() {

  try {

    const texto =
      localStorage.getItem(
        CHAVE_RASCUNHO
      );

    if (!texto) {
      return;
    }

    const dados =
      JSON.parse(texto);

    CAMPOS.forEach(
      id => {

        const campo =
          document.getElementById(id);

        if (
          campo &&
          dados[id] !== undefined
        ) {

          campo.value =
            dados[id];
        }
      }
    );

  } catch (erro) {

    console.log(
      'Erro ao restaurar:',
      erro
    );
  }
}


// ==========================================
// LIMITAR VALOR
// ==========================================

function limitar(
  valor,
  minimo,
  maximo
) {

  return Math.min(
    maximo,
    Math.max(
      minimo,
      valor
    )
  );
}


// ==========================================
// AJUSTAR CÂMERA
// ==========================================

async function ajustarCamera(
  track
) {

  const aplicados = [];

  try {

    if (
      !track ||
      typeof track.getCapabilities !== 'function'
    ) {

      statusCamera(
        'Câmera usando ajustes automáticos.'
      );

      return;
    }

    const caps =
      track.getCapabilities();

    const constraints = {};


    if (
      Array.isArray(
        caps.focusMode
      ) &&
      caps.focusMode.includes(
        'continuous'
      )
    ) {

      constraints.focusMode =
        'continuous';

      aplicados.push(
        'foco contínuo'
      );
    }


    if (
      caps.zoom &&
      Number.isFinite(
        caps.zoom.min
      ) &&
      Number.isFinite(
        caps.zoom.max
      )
    ) {

      const zoomDesejado =
        limitar(
          2,
          caps.zoom.min,
          caps.zoom.max
        );

      constraints.zoom =
        zoomDesejado;

      aplicados.push(
        'zoom ' +
        zoomDesejado.toFixed(1) +
        'x'
      );
    }


    if (
      Object.keys(
        constraints
      ).length > 0
    ) {

      await track.applyConstraints({
        advanced: [
          constraints
        ]
      });
    }


    if (
      aplicados.length > 0
    ) {

      statusCamera(
        'Ajustes ativos: ' +
        aplicados.join(' • ')
      );

    } else {

      statusCamera(
        'Câmera usando foco automático.'
      );
    }

  } catch (erro) {

    console.log(
      'Ajuste câmera:',
      erro
    );

    statusCamera(
      'Câmera usando foco automático.'
    );
  }
}


// ==========================================
// ABRIR LEITOR
// ==========================================

async function iniciarLeitor() {

  if (
    cameraAtiva
  ) {
    return;
  }

  salvarRascunho();

  mensagem(
    'Abrindo câmera...'
  );

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Câmera não disponível'
      );
    }


    if (
      typeof ZXingWASM === 'undefined' ||
      typeof ZXingWASM.readBarcodes !== 'function'
    ) {

      throw new Error(
        'Leitor não carregou'
      );
    }


    const video =
      document.getElementById(
        'video'
      );


    streamCamera =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        }

      });


    const tracks =
      streamCamera.getVideoTracks();


    if (
      tracks.length > 0
    ) {

      await ajustarCamera(
        tracks[0]
      );
    }


    video.srcObject =
      streamCamera;


    document
      .getElementById(
        'leitor'
      )
      .classList.add(
        'ativo'
      );


    await video.play();


    cameraAtiva =
      true;


    mensagem(
      'Leitor ativo. Aponte para o código.',
      'sucesso'
    );


    iniciarLoopLeitura();

  } catch (erro) {

    console.error(
      erro
    );

    await pararLeitor();

    mensagem(
      'ERRO: ' +
      (
        erro?.message ||
        String(erro)
      ),
      'erro'
    );
  }
}


// ==========================================
// LOOP
// ==========================================

function iniciarLoopLeitura() {

  if (
    loopLeitura
  ) {

    clearInterval(
      loopLeitura
    );
  }


  loopLeitura =
    setInterval(
      tentarLerQuadro,
      400
    );
}


// ==========================================
// LER QUADRO
// ==========================================

async function tentarLerQuadro() {

  if (
    !cameraAtiva ||
    lendoQuadro
  ) {

    return;
  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    !video ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;
  }


  lendoQuadro =
    true;


  try {

    const canvas =
      document.getElementById(
        'canvasLeitura'
      );


    const ctx =
      canvas.getContext(
        '2d',
        {
          willReadFrequently: true
        }
      );


    const vw =
      video.videoWidth;


    const vh =
      video.videoHeight;


    const cropW =
      Math.floor(
        vw * 0.96
      );


    const cropH =
      Math.floor(
        vh * 0.50
      );


    const sx =
      Math.floor(
        (
          vw -
          cropW
        ) / 2
      );


    const sy =
      Math.floor(
        (
          vh -
          cropH
        ) / 2
      );


    const destinoW =
      1400;


    const destinoH =
      Math.max(
        420,
        Math.round(
          cropH *
          (
            destinoW /
            cropW
          )
        )
      );


    canvas.width =
      destinoW;


    canvas.height =
      destinoH;


    ctx.drawImage(
      video,

      sx,
      sy,
      cropW,
      cropH,

      0,
      0,
      destinoW,
      destinoH
    );


    const imagem =
      ctx.getImageData(
        0,
        0,
        destinoW,
        destinoH
      );


    const resultados =
      await ZXingWASM.readBarcodes(
        imagem,
        {

          tryHarder: true,

          tryRotate: true,

          tryInvert: true,

          maxNumberOfSymbols: 1,

          formats: [
            'EAN13',
            'EAN8',
            'UPCA',
            'UPCE',
            'Code128',
            'Code39',
            'ITF'
          ]

        }
      );


    if (
      Array.isArray(
        resultados
      ) &&
      resultados.length > 0
    ) {

      const codigo =
        String(
          resultados[0]?.text ||
          ''
        ).trim();


      if (
        codigo &&
        codigo !== ultimoCodigo
      ) {

        ultimoCodigo =
          codigo;


        document
          .getElementById(
            'codigoBarras'
          )
          .value =
            codigo;


        document
          .getElementById(
            'codigoEncontrado'
          )
          .textContent =
            codigo;


        document
          .getElementById(
            'codigoLido'
          )
          .style.display =
            'block';


        salvarRascunho();


        mensagem(
          'Código lido com sucesso.',
          'sucesso'
        );


        await pararLeitor();


        setTimeout(
          () => {

            document
              .getElementById(
                'produto'
              )
              .focus();

          },
          250
        );
      }
    }

  } catch (erro) {

    console.log(
      'Tentativa de leitura:',
      erro
    );

  } finally {

    lendoQuadro =
      false;
  }
}


// ==========================================
// PARAR LEITOR
// ==========================================

async function pararLeitor() {

  if (
    loopLeitura
  ) {

    clearInterval(
      loopLeitura
    );

    loopLeitura =
      null;
  }


  cameraAtiva =
    false;


  lendoQuadro =
    false;


  if (
    streamCamera
  ) {

    try {

      streamCamera
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    } catch (erro) {}


    streamCamera =
      null;
  }


  const video =
    document.getElementById(
      'video'
    );


  if (video) {

    try {

      video.pause();

    } catch (erro) {}


    video.srcObject =
      null;
  }


  document
    .getElementById(
      'leitor'
    )
    .classList.remove(
      'ativo'
    );
}


// ==========================================
// FOTO PRODUTO
// ==========================================

function mostrarFoto(
  input
) {

  salvarRascunho();


  if (
    !input.files ||
    !input.files[0]
  ) {

    return;
  }


  const url =
    URL.createObjectURL(
      input.files[0]
    );


  document
    .getElementById(
      'imagemPreview'
    )
    .src =
      url;


  document
    .getElementById(
      'fotoPreview'
    )
    .style.display =
      'block';
}


// ==========================================
// VALIDAR PRODUTO
// ==========================================

function validarProduto() {

  salvarRascunho();


  const codigo =
    document
      .getElementById(
        'codigoBarras'
      )
      .value
      .trim();


  const produto =
    document
      .getElementById(
        'produto'
      )
      .value
      .trim();


  const preco =
    Number(
      document
        .getElementById(
          'preco'
        )
        .value ||
        0
    );


  if (
    !codigo
  ) {

    mensagem(
      'Leia ou informe o código de barras.',
      'erro'
    );

    return;
  }


  if (
    !produto
  ) {

    mensagem(
      'Digite o nome do produto.',
      'erro'
    );

    return;
  }


  if (
    !Number.isFinite(
      preco
    ) ||
    preco <= 0
  ) {

    mensagem(
      'Informe o preço de venda.',
      'erro'
    );

    return;
  }


  mensagem(
    'Dados conferidos. Cadastro pronto para ser conectado ao n8n.',
    'sucesso'
  );
}


// ==========================================
// PRÓXIMO PRODUTO
// ==========================================

async function proximoProduto() {

  await pararLeitor();


  ultimoCodigo =
    '';


  CAMPOS.forEach(
    id => {

      const campo =
        document.getElementById(
          id
        );


      if (campo) {

        campo.value =
          id === 'estoque'
            ? '1'
            : '';
      }

    }
  );


  document
    .getElementById(
      'foto'
    )
    .value =
      '';


  document
    .getElementById(
      'fotoPreview'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'codigoLido'
    )
    .style.display =
      'none';


  localStorage.removeItem(
    CHAVE_RASCUNHO
  );


  mensagem(
    'Pronto para o próximo produto.'
  );
}


// ==========================================
// INICIALIZAÇÃO
// ==========================================

document.addEventListener(
  'DOMContentLoaded',
  function() {

    restaurarRascunho();


    CAMPOS.forEach(
      id => {

        const campo =
          document.getElementById(
            id
          );


        if (!campo) {
          return;
        }


        campo.addEventListener(
          'input',
          salvarRascunho
        );


        campo.addEventListener(
          'change',
          salvarRascunho
        );

      }
    );

  }
);


window.addEventListener(
  'pagehide',
  function() {

    salvarRascunho();
    pararLeitor();

  }
);


window.addEventListener(
  'beforeunload',
  function() {

    salvarRascunho();
    pararLeitor();

  }
);

</script>

</body>
</html>
