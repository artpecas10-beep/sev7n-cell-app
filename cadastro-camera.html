<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro com Câmera - SEV7N CELL</title>

  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@latest/dist/iife/reader/index.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f8;
      color: #172033;
    }

    header {
      background: #071b3a;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .82;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px 40px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .titulo {
      margin: 0 0 15px;
      font-size: 19px;
      color: #071b3a;
    }

    .leitor {
      display: none;
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 270px;
    }

    .leitor.ativo {
      display: block;
    }

    #video {
      width: 100%;
      min-height: 270px;
      max-height: 430px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .mira {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 31%;
      height: 38%;
      border: 3px solid #22c55e;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.18);
      pointer-events: none;
    }

    .linha {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 3px;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      pointer-events: none;
    }

    .dica {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 8px;
      text-align: center;
      color: white;
      background: rgba(0,0,0,.60);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
    }

    .acoes {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-abrir {
      flex: 1;
      background: #1d5da8;
      color: white;
    }

    .btn-parar {
      background: #e5e7eb;
      color: #333;
    }

    .mensagem {
      margin-top: 12px;
      min-height: 22px;
      font-weight: bold;
      word-break: break-word;
    }

    .sucesso { color: #15803d; }
    .erro { color: #b91c1c; }
    .aviso { color: #9a6700; }

    .codigo-lido {
      background: #dcfce7;
      border: 1px solid #86efac;
      padding: 15px;
      border-radius: 9px;
      margin-top: 14px;
      display: none;
    }

    .codigo-lido strong {
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    #codigoBarras {
      font-size: 21px;
      font-weight: bold;
      border: 2px solid #1d5da8;
    }

    #canvasLeitura {
      display: none;
    }

    @media (max-width: 600px) {
      .acoes {
        display: block;
      }

      .acoes button {
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SEV7N CELL</h1>
  <p>Leitor ao vivo de código de barras</p>
</header>

<div class="container">

  <div class="card">

    <h2 class="titulo">📷 Leitor ao vivo</h2>

    <div id="leitor" class="leitor">
      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <div class="mira"></div>
      <div class="linha"></div>

      <div class="dica">
        Mantenha o código inteiro dentro do retângulo verde.
      </div>
    </div>

    <canvas id="canvasLeitura"></canvas>

    <div class="acoes">
      <button
        id="btnAbrir"
        type="button"
        class="btn-abrir"
        onclick="iniciarLeitor()"
      >
        ABRIR LEITOR
      </button>

      <button
        type="button"
        class="btn-parar"
        onclick="pararLeitor()"
      >
        PARAR
      </button>
    </div>

    <div
      id="codigoLido"
      class="codigo-lido"
    >
      Código identificado:
      <br />
      <strong id="codigoEncontrado"></strong>
    </div>

    <div
      id="mensagem"
      class="mensagem"
    ></div>

  </div>

  <div class="card">
    <h2 class="titulo">Código de barras</h2>

    <label for="codigoBarras">
      Código identificado
    </label>

    <input
      id="codigoBarras"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="O código aparecerá aqui"
    />
  </div>

</div>

<script>

let streamCamera = null;
let cameraAtiva = false;
let lendoQuadro = false;
let loopLeitura = null;
let ultimoCodigo = '';

function mensagem(texto, tipo = '') {
  const el = document.getElementById('mensagem');
  el.className = 'mensagem ' + tipo;
  el.textContent = texto || '';
}

async function iniciarLeitor() {

  if (cameraAtiva) {
    return;
  }

  mensagem('Abrindo câmera...');

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        'getUserMedia não disponível neste navegador'
      );
    }

    if (
      typeof ZXingWASM === 'undefined' ||
      typeof ZXingWASM.readBarcodes !== 'function'
    ) {
      throw new Error(
        'Leitor ZXing WASM não carregou'
      );
    }

    const video =
      document.getElementById('video');

    streamCamera =
      await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: {
            ideal: 'environment'
          }
        }
      });

    video.srcObject =
      streamCamera;

    document
      .getElementById('leitor')
      .classList.add('ativo');

    await video.play();

    cameraAtiva = true;

    mensagem(
      'Leitor ativo. Aponte para o código de barras.',
      'sucesso'
    );

    iniciarLoopLeitura();

  } catch (erro) {

    console.error(
      'Erro ao abrir leitor:',
      erro
    );

    await pararLeitor();

    mensagem(
      'ERRO: ' +
      (erro?.name || 'SEM_NOME') +
      ' | ' +
      (erro?.message || String(erro)),
      'erro'
    );
  }
}

function iniciarLoopLeitura() {

  if (loopLeitura) {
    clearInterval(loopLeitura);
  }

  loopLeitura =
    setInterval(
      tentarLerQuadro,
      450
    );
}

async function tentarLerQuadro() {

  if (
    !cameraAtiva ||
    lendoQuadro
  ) {
    return;
  }

  const video =
    document.getElementById('video');

  if (
    !video ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return;
  }

  lendoQuadro = true;

  try {

    const canvas =
      document.getElementById(
        'canvasLeitura'
      );

    const ctx =
      canvas.getContext(
        '2d',
        {
          willReadFrequently: true
        }
      );

    const vw =
      video.videoWidth;

    const vh =
      video.videoHeight;

    const cropW =
      Math.floor(vw * 0.92);

    const cropH =
      Math.floor(vh * 0.42);

    const sx =
      Math.floor(
        (vw - cropW) / 2
      );

    const sy =
      Math.floor(
        (vh - cropH) / 2
      );

    const destinoW =
      1100;

    const destinoH =
      Math.max(
        300,
        Math.round(
          cropH *
          (destinoW / cropW)
        )
      );

    canvas.width =
      destinoW;

    canvas.height =
      destinoH;

    ctx.drawImage(
      video,
      sx,
      sy,
      cropW,
      cropH,
      0,
      0,
      destinoW,
      destinoH
    );

    const imagem =
      ctx.getImageData(
        0,
        0,
        destinoW,
        destinoH
      );

    const resultados =
      await ZXingWASM.readBarcodes(
        imagem,
        {
          tryHarder: true,
          maxNumberOfSymbols: 1
        }
      );

    if (
      Array.isArray(resultados) &&
      resultados.length > 0
    ) {

      const codigo =
        String(
          resultados[0]?.text || ''
        ).trim();

      if (
        codigo &&
        codigo !== ultimoCodigo
      ) {

        ultimoCodigo =
          codigo;

        document
          .getElementById(
            'codigoBarras'
          )
          .value =
            codigo;

        document
          .getElementById(
            'codigoEncontrado'
          )
          .textContent =
            codigo;

        document
          .getElementById(
            'codigoLido'
          )
          .style.display =
            'block';

        mensagem(
          'Código lido com sucesso.',
          'sucesso'
        );

        if (navigator.vibrate) {
          try {
            navigator.vibrate(120);
          } catch (erro) {}
        }

        await pararLeitor();
      }
    }

  } catch (erro) {

    console.log(
      'Tentativa de leitura:',
      erro
    );

  } finally {

    lendoQuadro = false;
  }
}

async function pararLeitor() {

  if (loopLeitura) {
    clearInterval(loopLeitura);
    loopLeitura = null;
  }

  cameraAtiva = false;
  lendoQuadro = false;

  if (streamCamera) {

    try {
      streamCamera
        .getTracks()
        .forEach(
          track => track.stop()
        );
    } catch (erro) {}

    streamCamera = null;
  }

  const video =
    document.getElementById('video');

  if (video) {

    try {
      video.pause();
    } catch (erro) {}

    video.srcObject = null;
  }

  document
    .getElementById('leitor')
    .classList.remove('ativo');
}

window.addEventListener(
  'pagehide',
  pararLeitor
);

window.addEventListener(
  'beforeunload',
  pararLeitor
);

</script>

</body>
</html>
