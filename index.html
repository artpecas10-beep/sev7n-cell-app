<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SEV7N CELL</title>

  <meta name="theme-color" content="#07111f">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icone-sev7n.png">
  <link rel="apple-touch-icon" href="icone-sev7n.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #102b49 0%, #07111f 45%, #030812 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .logo-box {
      border: 2px solid #1f6fff;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 35px;
      background: rgba(4, 15, 31, 0.80);
      box-shadow: 0 0 25px rgba(31, 111, 255, 0.18);
    }

    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 24px;
      margin-bottom: 15px;
    }

    .logo-box h1 {
      font-size: 38px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .logo-box h1 span {
      color: #1687ff;
    }

    .logo-box p {
      margin-top: 8px;
      color: #a9b8ca;
      font-size: 14px;
      letter-spacing: 3px;
    }

    .titulo {
      text-align: center;
      font-size: 18px;
      margin-bottom: 24px;
      color: #dce7f5;
      font-weight: 700;
    }

    .botao {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      text-decoration: none;
      color: white;
      padding: 22px 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: 700;
      transition: 0.2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .botao:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .botao:active {
      transform: scale(0.98);
    }

    .icone {
      font-size: 34px;
      width: 45px;
      text-align: center;
    }

    .texto small {
      display: block;
      font-size: 12px;
      font-weight: normal;
      margin-top: 5px;
      opacity: 0.85;
    }

    .servico {
      background: linear-gradient(135deg, #0868ff, #0047b8);
    }

    .venda {
      background: linear-gradient(135deg, #12a856, #08763b);
    }

    .cpf {
      background: linear-gradient(135deg, #ff8a00, #d95b00);
    }

    .rodape {
      text-align: center;
      margin-top: 28px;
      color: #65758a;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .logo-box h1 {
        font-size: 32px;
      }

      .botao {
        padding: 19px 16px;
        font-size: 18px;
      }

      .logo-img {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo-box">

      <img
        src="icone-sev7n.png"
        alt="SEV7N CELL"
        class="logo-img"
      >

      <h1>
        SEV<span>7</span>N CELL
      </h1>

      <p>SISTEMA DA LOJA</p>

    </div>

    <div class="titulo">
      SELECIONE O QUE DESEJA FAZER
    </div>

    <a
      class="botao servico"
      href="https://n8n.artpecascelular.com/form/4aea4778-ea9a-4cc5-befb-0dcccc34a286"
    >
      <div class="icone">🔧</div>

      <div class="texto">
        SERVIÇO
        <small>Abrir ordem de serviço</small>
      </div>
    </a>

    <a
      class="botao venda"
      href="https://n8n.artpecascelular.com/form/4f05cccd-3a9c-4014-91de-e8d0b2cd23b5"
    >
      <div class="icone">📱</div>

      <div class="texto">
        VENDA DE APARELHO
        <small>Nova venda ou histórico de vendas</small>
      </div>
    </a>

    <a
      class="botao cpf"
      href="https://n8n.artpecascelular.com/form/83cb748e-1650-4726-8a49-24e29277da1a"
    >
      <div class="icone">🧾</div>

      <div class="texto">
        CPF NA NOTA
        <small>Emitir NFC-e com CPF</small>
      </div>
    </a>

    <div class="rodape">
      SEV7N CELL • Sistema Interno
    </div>

  </main>

</body>
</html>
